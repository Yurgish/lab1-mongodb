[project]
name = "lab1-mongodb"
version = "0.1.0"
description = ""
authors = [
    {name = "Yurgish",email = "humenyuriipetrovych@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "pymongo (>=4.18.1,<5.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)"
]

[tool.poetry]
# Вказуємо, що пакет 'app' лежить всередині директорії 'src'
packages = [{ include = "app", from = "src" }]

[tool.poetry.scripts]
# Тепер шлях коротший, без 'src.'
dev = "app.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true